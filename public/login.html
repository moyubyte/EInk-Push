<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · EInkPush</title>
<style>
  :root { color-scheme: light; --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #86868b; --line: #e8e8ed; --accent: #0071e3; --danger: #d70015; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px; padding: 40px 34px 32px; border-radius: 22px;
    background: var(--card); box-shadow: 0 18px 50px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
  }
  .mark { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 12px 0 8px; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
  .sub { margin: 0 0 26px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
  input {
    width: 100%; height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
    background: #fbfbfd; color: var(--text); font-size: 16px; outline: none;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  input:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,113,227,.12); }
  button {
    width: 100%; height: 48px; margin-top: 18px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: opacity .18s ease, transform .18s ease;
  }
  button:hover { opacity: .9; }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .45; cursor: default; }
  .err { min-height: 20px; margin: 14px 0 0; font-size: 13px; color: var(--danger); }
  .foot { margin: 26px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">EInkPush</div>
    <h1>输入密码</h1>
    <p class="sub">访问设备与应用需要密码。初始密码为 helloworld，可在登录后的「设备」页修改。</p>
    <form id="loginForm" autocomplete="on">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button id="submitBtn" type="submit">进入</button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <p class="foot">建议通过 HTTPS 访问后再开放到公网</p>
  </main>

<script>
  const next = (() => {
    const raw = new URLSearchParams(location.search).get('next') || '';
    if (!raw) return '/';
    try {
      const url = new URL(raw, location.origin);
      if (url.origin === location.origin && !url.pathname.startsWith('/login')) {
        return url.pathname + url.search;
      }
    } catch {}
    return '/';
  })();

  const err = document.getElementById('err');
  const input = document.getElementById('password');
  const button = document.getElementById('submitBtn');
  const form = document.getElementById('loginForm');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = input.value;
    if (!password) {
      err.textContent = '请输入密码';
      input.focus();
      return;
    }
    button.disabled = true;
    err.textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.ok) {
        location.replace(next);
        return;
      }
      err.textContent = data.error || '密码错误';
      input.value = '';
      input.focus();
    } catch (e) {
      err.textContent = '登录失败：' + e.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
